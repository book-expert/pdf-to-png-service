text_directive_generation_prompt = """
You are a text analysis director. Your job is to analyze the structure of the attached PDF and create a concise "text directive" prompt for another AI that will perform text extraction on a page-by-page basis.

**Standard Directives (Your base instructions for the next AI):**
- "Extract the main body text."
- "Ignore all page numbers, headers, and footers."
- "Do not extract content from the bibliography, reference, or index sections."
- "Ignore any text that appears to be part of a table of contents or list of figures."
- "Remove in-text citations, such as (Author, 2021) or [1]."

**User Modifications:**
- **User Exclusions:** '{{.Exclusions}}'
- **User Augmentations:** '{{.AugmentationPrompt}}'

**Your Task:**
Combine the "Standard Directives" with the "User Modifications" to create a final, consolidated set of instructions. This final text directive will be used as a prompt for the text extraction AI.

**Return a single plain text block containing the final directive. Do not use JSON.**
"""

music_config_generation_prompt = """
You are a musical director. Your job is to analyze the attached PDF and a user's music request to create a complete JSON configuration for our Lyria music generation service.

Even if the user provides a simple, short prompt (e.g., "sad piano"), your task is to analyze the document's mood, tone, and subject matter to create a rich, detailed, and unique configuration that enhances the narration.

**User Preferences:**
- **Music Request:** '{{.SoundscapePrompt}}'
- **Augmentations:** '{{.AugmentationPrompt}}'

**Task:**
Generate a strictly valid JSON object that contains a `music_prompt` and a `generation_config`.

```json
{
  "music_prompt": "...",
  "generation_config": {
    "bpm": ...,
    "density": ...,
    "brightness": ...,
    "scale": "...",
    "guidance": ...,
    "mute_bass": ...,
    "mute_drums": ...,
    "only_bass_and_drums": ...,
    "music_generation_mode": "..."
  }
}
```

**Detailed Requirements:**

1.  **`music_prompt` (string):**
    -   **Goal:** Create a detailed "soundtrack" description suitable for generating a 2-3 minute soundscape that loops or cuts as needed to fit the narration.
    -   **Use Specific Terminology:** Incorporate specific instruments, genres, and mood descriptors from the lists below to guide the AI.

    **AVAILABLE INSTRUMENTS (Choose wisely):**
    303 Acid Bass, 808 Hip Hop Beat, Accordion, Alto Saxophone, Bagpipes, Balalaika Ensemble, Banjo, Bass Clarinet, Bongos, Boomy Bass, Bouzouki, Buchla Synths, Cello, Charango, Clavichord, Conga Drums, Didgeridoo, Dirty Synths, Djembe, Drumline, Dulcimer, Fiddle, Flamenco Guitar, Funk Drums, Glockenspiel, Guitar, Hang Drum, Harmonica, Harp, Harpsichord, Hurdy-gurdy, Kalimba, Koto, Lyre, Mandolin, Maracas, Marimba, Mbira, Mellotron, Metallic Twang, Moog Oscillations, Ocarina, Persian Tar, Pipa, Precision Bass, Ragtime Piano, Rhodes Piano, Shamisen, Shredding Guitar, Sitar, Slide Guitar, Smooth Pianos, Spacey Synths, Steel Drum, Synth Pads, Tabla, TR-909 Drum Machine, Trumpet, Tuba, Vibraphone, Viola Ensemble, Warm Acoustic Guitar, Woodwinds.

    **AVAILABLE GENRES:**
    Acid Jazz, Afrobeat, Alternative Country, Baroque, Bengal Baul, Bhangra, Bluegrass, Blues Rock, Bossa Nova, Breakbeat, Celtic Folk, Chillout, Chiptune, Classic Rock, Contemporary R&B, Cumbia, Deep House, Disco Funk, Drum & Bass, Dubstep, EDM, Electro Swing, Funk Metal, G-funk, Garage Rock, Glitch Hop, Grime, Hyperpop, Indian Classical, Indie Electronic, Indie Folk, Indie Pop, Irish Folk, Jam Band, Jamaican Dub, Jazz Fusion, Latin Jazz, Lo-Fi Hip Hop, Marching Band, Merengue, New Jack Swing, Minimal Techno, Moombahton, Neo-Soul, Orchestral Score, Piano Ballad, Polka, Post-Punk, 60s Psychedelic Rock, Psytrance, R&B, Reggae, Reggaeton, Renaissance Music, Salsa, Shoegaze, Ska, Surf Rock, Synthpop, Techno, Trance, Trap Beat, Trip Hop, Vaporwave, Witch house.

    **MOODS/DESCRIPTORS:**
    Acoustic Instruments, Ambient, Bright Tones, Chill, Crunchy Distortion, Danceable, Dreamy, Echo, Emotional, Ethereal Ambience, Experimental, Fat Beats, Funky, Glitchy Effects, Huge Drop, Live Performance, Lo-fi, Ominous Drone, Psychedelic, Rich Orchestration, Saturated Tones, Subdued Melody, Sustained Chords, Swirling Phasers, Tight Groove, Unsettling, Upbeat, Virtuoso, Weird Noises.

    -   **Structure:**
        -   Start with the **Genre/Vibe**.
        -   Describe the **Instrumentation**.
        -   Describe the **Texture/Atmosphere**.
    
    -   *Example Output:* "Genre: Cinematic Ambient. Mood: Intellectual, Mysterious, Vast. Instrumentation: A wash of analog synth pads (Jupiter-8 style) creating a warm, evolving chord progression. Underneath, a deep, resonant cello plays a slow, mourning melody. Occasional subtle metallic twangs and tape echoes add a sense of ancient technology. Texture: Smooth, expansive, and reverb-heavy. No drums, no vocals. Suitable for a paced reading of a sci-fi novel."

2.  **`generation_config` (object):**
    -   Infer the optimal parameters based on your analysis.
    -   `bpm` (integer): Beats Per Minute, between 60 and 200.
    -   `density` (float): Musical note density, between 0.0 and 1.0.
    -   `brightness` (float): Tonal quality, between 0.0 and 1.0.
    -   `guidance` (float): Model adherence to the prompt, between 0.0 and 6.0.
    -   `mute_bass` (boolean): `true` to reduce bass.
    -   `mute_drums` (boolean): `true` to reduce drums.
    -   `only_bass_and_drums` (boolean): `true` to attempt to only output bass and drums.
    -   `music_generation_mode` (string): Must be one of "QUALITY", "DIVERSITY", or "VOCALIZATION".
    -   `scale` (string): The musical scale. Must be one of the following enum values:
        - "C_MAJOR_A_MINOR"
        - "D_FLAT_MAJOR_B_FLAT_MINOR"
        - "D_MAJOR_B_MINOR"
        - "E_FLAT_MAJOR_C_MINOR"
        - "E_MAJOR_D_FLAT_MINOR"
        - "F_MAJOR_D_MINOR"
        - "G_FLAT_MAJOR_E_FLAT_MINOR"
        - "G_MAJOR_E_MINOR"
        - "A_FLAT_MAJOR_F_MINOR"
        - "A_MAJOR_G_FLAT_MINOR"
        - "B_FLAT_MAJOR_G_MINOR"
        - "B_MAJOR_A_FLAT_MINOR"
        - "SCALE_UNSPECIFIED"

**You MUST output a single, valid JSON object and nothing else.**
"""

[nats]
url = "nats://192.168.122.102:4222"
dlq_subject = "pdf-to-png.dlq"

[nats.consumer]
stream = "PDFS"
subject = "pdfs.created"
